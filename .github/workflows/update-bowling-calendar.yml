name: Keep bowling calendar current
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_bowling_calendar.py
      - .github/workflows/update-bowling-calendar.yml
permissions:
  contents: write
concurrency:
  group: update-bowling-calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core
      - run: pip install reportlab==4.4.3 pypdf==5.9.0
      - run: python scripts/test_bowling_calendar.py
      - run: python scripts/update_bowling_calendar.py
      - name: Publish changed calendar
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/bowling-nights-2026-27.pdf downloads/bowling-nights-2026-27.source.json
          if ! git diff --cached --quiet; then
            test -n "$RENDER_DEPLOY_HOOK"
            git commit -m 'Synchronize bowling calendar with live schedule'
            git pull --rebase origin main
            git push origin main
          fi
          curl --fail --silent --show-error --retry 3 "https://thamesclub1869.com/downloads/bowling-nights-2026-27.pdf?sync=${GITHUB_RUN_ID}" -o /tmp/published.pdf
          if ! cmp -s downloads/bowling-nights-2026-27.pdf /tmp/published.pdf; then
            test -n "$RENDER_DEPLOY_HOOK"
            curl --fail --silent --show-error --retry 3 --request POST "$RENDER_DEPLOY_HOOK" >/dev/null
          fi
